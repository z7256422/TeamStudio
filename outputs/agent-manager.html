<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Agent 协同控制台 · Team Studio</title>
  <link rel="icon" href="data:," />
  <style>/* 设计基础：统一尺寸、色板与控件，不依赖历史模板。 */
:root {
  --bg: #fff; --surface: #f7f8fa; --surface-hover: #f0f1f5;
  --text: #252831; --muted: #7a7f8d; --line: #e8e9ee;
  --accent: #6355ce; --accent-soft: #f0edfc; --accent-text: #5b4bc0;
  --green: #37947a; --red: #c44753;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  color: var(--text); background: var(--bg); font-size: 13px; font-synthesis: none;
}
* { box-sizing: border-box; }
body { margin: 0; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; color: inherit; border: 0; background: none; }
button, input, textarea, select { -webkit-tap-highlight-color: transparent; }
button:disabled, input:disabled, select:disabled, textarea:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
svg { flex: 0 0 auto; vertical-align: middle; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 13px; font-weight: 600; }
h2 { font-size: 23px; font-weight: 650; letter-spacing: -.6px; }
h3 { font-size: 14px; font-weight: 600; }
p { line-height: 1.8; }
small { font-size: 11px; }
b, strong { font-weight: 600; }
fieldset { padding: 0; margin: 0; border: 0; min-width: 0; }
:where(input:not([type=checkbox]):not([type=radio]):not([type=range])), select, textarea { width: 100%; min-width: 0; border: 1px solid #dddfe7; border-radius: 6px; background: var(--bg); color: var(--text); padding: 9px 11px; transition: border-color .15s; }
select { height: 37px; padding-right: 28px; text-overflow: ellipsis; }
input::placeholder, textarea::placeholder { color: #a0a4af; }
textarea { resize: vertical; line-height: 1.8; }
input[type=checkbox], input[type=radio] { width: 15px; height: 15px; flex-shrink: 0; accent-color: var(--accent); }
pre { font-family: "Cascadia Code", Consolas, "Microsoft YaHei", monospace; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.85; margin: 0; font-size: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 13px; min-height: 36px; border: 1px solid #dddfe7; border-radius: 6px; background: white; font-size: 12px; font-weight: 500; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--surface); border-color: #c7c9d3; }
.btn.primary { color: white; background: var(--accent); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { background: #5344b9; }
.btn.compact { padding: 6px 10px; min-height: 30px; font-size: 11px; }
.btn.danger, .danger { color: var(--red); }
.icon-button { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; flex: 0 0 auto; border-radius: 5px; color: var(--muted); }
.icon-button:hover:not(:disabled) { background: var(--surface-hover); color: var(--text); }
.text-button { color: var(--accent-text); display: inline-flex; align-items: center; gap: 7px; padding: 4px 0; font-size: 12px; }
.text-button:hover:not(:disabled) { text-decoration: underline; }
.muted { color: var(--muted); font-size: 12px; }
.eyebrow { display: block; color: var(--muted); font-size: 11px; letter-spacing: .6px; line-height: 1.6; }
.badge, .count { display: inline-flex; align-items: center; border-radius: 4px; background: #f0f1f4; color: #7b8090; font-size: 11px; font-weight: 500; padding: 3px 7px; white-space: nowrap; }
.count { padding: 1px 5px; font-size: 11px; }
.badge.running { color: var(--accent-text); background: var(--accent-soft); }
.badge.done { color: #34866f; background: #eaf6f0; }
.badge.cancelled { color: #aa6b4c; background: #fbf0e9; }
.badge.waiting, .badge.retrying, .badge.reconnecting { color: #956923; background: #fff4dc; }
.badge.failed { color: var(--red); background: #fff0f1; }
.status-dot.failed { background: var(--red); }
.status-dot.waiting, .status-dot.retrying, .status-dot.reconnecting { background: #bd8b2b; }
.status-dot { display: inline-block; width: 6px; height: 6px; flex-shrink: 0; border-radius: 50%; background: #b6bac7; }
.status-dot.connected, .status-dot.done { background: var(--green); }
.status-dot.running, .status-dot.checking { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.status-dot.cancelled, .status-dot.offline { background: #ce925c; }
.avatar { width: 32px; height: 32px; flex-shrink: 0; border-radius: 9px; background: #eef0f5; color: #69758a; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; }
.avatar.team { color: var(--accent-text); background: var(--accent-soft); }
.avatar.large { width: 52px; height: 52px; border-radius: 13px; font-size: 20px; }
.field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; min-width: 0; }
.field-label { font-size: 12px; font-weight: 500; color: #494d59; }
.field-help { font-size: 11px; color: var(--muted); line-height: 1.75; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.form-page { max-width: 860px; width: 100%; padding: 30px 38px 50px; }
.settings-section + .settings-section { border-top: 1px solid var(--line); padding-top: 28px; margin-top: 28px; }
.section-label { margin-bottom: 24px; }
.section-label p { color: var(--muted); font-size: 12px; margin-top: 7px; }
.section-inline { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.inline-note { display: flex; align-items: flex-start; gap: 10px; border-radius: 6px; padding: 13px 15px; background: var(--surface); color: var(--muted); font-size: 11px; line-height: 1.8; }
.inline-note svg { margin-top: 3px; color: #9a94bc; }
.action-row { display: flex; gap: 10px; flex-wrap: wrap; }
.search-box { display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: white; border-radius: 6px; padding: 0 9px; color: #a1a5b2; }
.search-box input[type=search] { border: 0; background: transparent; padding: 8px 0; font-size: 11px; }
.search-box:focus-within { outline: 2px solid var(--accent-soft); border-color: #b8addf; }
.search-box input:focus-visible { outline: none; }
.tabs { display: flex; align-items: stretch; gap: 26px; border-bottom: 1px solid var(--line); padding: 0 36px; flex: 0 0 auto; overflow-x: auto; }
.tabs button { position: relative; display: inline-flex; gap: 7px; align-items: center; padding: 16px 0; font-size: 12px; color: var(--muted); white-space: nowrap; }
.tabs button.active { color: var(--accent-text); font-weight: 600; }
.tabs button.active::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--accent); border-radius: 2px; }
.tabs button.active .count { color: var(--accent-text); background: var(--accent-soft); }
.empty-state { margin: auto; padding: 60px 24px; text-align: center; max-width: 440px; color: var(--muted); }
.empty-icon { display: inline-flex; padding: 16px; border: 1px solid var(--line); border-radius: 15px; margin-bottom: 20px; background: var(--surface); color: #9298aa; }
.empty-state h3 { color: #555c6d; margin-bottom: 9px; font-weight: 500; }
.empty-state p { font-size: 12px; }
.quiet-empty { padding: 30px 12px; color: var(--muted); font-size: 12px; text-align: center; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.notice { display: flex; align-items: center; gap: 12px; padding: 10px 22px; font-size: 12px; flex: 0 0 auto; background: #f8f5ed; border-bottom: 1px solid #eee6cf; color: #86704b; }
.notice > span:first-child { flex: 1; }
.undo-notice { background: #f4f2fe; border-color: #e6e0fc; color: var(--accent-text); }
.undo-notice > span:first-child { flex: 0 1 auto; }
.undo-notice .icon-button { margin-left: auto; }
.approval-notice { display: block; max-height: 32vh; overflow: auto; }
.approval-notice summary { cursor: pointer; margin-top: 6px; }
.approval-row { display: flex; gap: 8px; align-items: center; margin-top: 9px; }
.approval-row > span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.approval-row small { display: block; margin-top: 5px; }
.run-progress { margin: 12px 0 20px; font-size: 12px; min-width: 0; }
.output-reader > .run-progress { margin: 0 32px 20px; }
.progress-status { display: flex; align-items: baseline; flex-wrap: wrap; gap: 7px 16px; color: var(--muted); }
.progress-status small { white-space: nowrap; }
.run-error { color: var(--red); background: #fff5f5; border-radius: 6px; padding: 10px 12px; margin: 9px 0; overflow-wrap: anywhere; }
.run-steps { margin-top: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.run-steps summary { cursor: pointer; color: var(--accent-text); }
.run-step { padding: 12px 0; border-top: 1px solid var(--line); margin-top: 10px; }
.run-step > div { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.run-step pre { max-height: 200px; overflow: auto; font-size: 11px; }
.step-output { padding: 9px; margin-top: 8px; background: var(--surface); border-radius: 5px; }
.history-output { width: min(100%, 1160px); box-sizing: border-box; align-self: center; border-top: 1px solid var(--line); padding-top: 20px; margin: 20px auto 0; }
.history-output > button { margin-top: 18px; }
@media (max-width: 760px) { .approval-row { flex-wrap: wrap; } .approval-row > span { flex-basis: 100%; } }
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; color: var(--text); width: 520px; max-width: calc(100vw - 32px); max-height: calc(100dvh - 40px); box-shadow: 0 24px 100px #25203830; }
dialog::backdrop { background: #1f20364f; backdrop-filter: blur(3px); }
.dialog-top { padding: 24px 26px; display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid var(--line); }
.dialog-top h3 { font-size: 18px; margin: 5px 0; }
.dialog-top p { font-size: 12px; color: var(--muted); }
.dialog-form { padding: 24px 26px 6px; }
.dialog-actions { padding: 17px 26px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; background: var(--surface); }
.dialog-actions > span { font-size: 11px; color: var(--muted); margin-right: auto; align-self: center; }
.export-dialog { width: 720px; }
.export-dialog > textarea { display: block; margin: 22px 26px; width: calc(100% - 52px); height: 320px; font: 12px/1.7 Consolas, monospace; }
.dialog-message { padding: 12px 26px; font-size: 12px; color: var(--accent); }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 20; border-radius: 9px; background: #30303a; color: white; box-shadow: 0 5px 25px #25203822; font-size: 12px; padding: 13px 20px; max-width: calc(100vw - 30px); line-height: 1.7; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* 应用骨架：固定导航、单层工具条和占满剩余空间的工作区。 */
.studio-shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); height: 100dvh; min-height: 480px; }
.sidebar { background: #f7f8fa; border-right: 1px solid var(--line); padding: 28px 16px 16px; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; margin: 0 7px 30px; font-size: 17px; font-weight: 650; letter-spacing: -.45px; }
.brand-symbol { display: grid; place-items: center; height: 35px; width: 35px; color: white; background: #303140; border-radius: 10px; }
.brand small { display: block; color: #9396a3; font-size: 10px; font-weight: 400; letter-spacing: .55px; margin-top: 3px; }
.workspace-select { padding: 0 4px 22px; }
.workspace-select .eyebrow { margin: 0 4px 8px; }
.workspace-select select { font-size: 12px; background: #fff; box-shadow: 0 2px 3px #25283103; }
.nav-label { display: block; font-size: 11px; color: #9b9fac; margin: 28px 12px 10px; letter-spacing: .5px; }
.nav-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; text-align: left; font-size: 12px; color: #777d8c; border-radius: 6px; margin: 2px 0; }
.nav-item > span:first-of-type { flex: 1; }
.nav-item svg { color: #9499a8; }
.nav-item:hover { background: #edecf2; }
.nav-item.active { background: #eae7f6; color: var(--accent-text); font-weight: 600; }
.nav-item.active svg { color: var(--accent-text); }
.sidebar-bottom { margin-top: auto; padding-top: 34px; }
.config-tools { display: flex; justify-content: space-between; padding: 0 6px 17px; }
.config-tools button { display: flex; align-items: center; gap: 7px; color: #8b8f9c; font-size: 11px; padding: 4px 0; }
.config-tools button:hover { color: var(--accent); }
.runtime-status { display: flex; align-items: center; gap: 9px; border-top: 1px solid var(--line); padding: 19px 5px 0; width: 100%; text-align: left; }
.runtime-status > span:nth-child(2) { flex: 1; font-size: 11px; color: #6c7382; }
.runtime-status small { display: block; color: #a0a5b1; font-size: 10px; margin-top: 5px; }
.runtime-status svg { color: #b0b3bc; }
.studio-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; background: white; }
.workspace-bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 62px; padding: 0 28px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.breadcrumbs { display: flex; align-items: center; gap: 14px; font-size: 11px; color: #a2a5b0; white-space: nowrap; }
.breadcrumbs h1 { font-size: 12px; color: #505562; font-weight: 500; }
.bar-actions { display: flex; align-items: center; gap: 18px; }
.save-state { display: inline-flex; align-items: center; gap: 6px; color: #9397a3; font-size: 11px; white-space: nowrap; }
.save-state i { width: 4px; height: 4px; border-radius: 50%; background: #acbbb6; }
.save-state.dirty i { background: #c6a26a; }
.page-stage { display: flex; flex-direction: column; flex: 1; min-height: 0; min-width: 0; overflow: hidden; }
.mobile-menu, .nav-backdrop { display: none; }
@media (max-width: 1100px) {
  .studio-shell { grid-template-columns: 184px minmax(0,1fr); }
  .sidebar { padding-left: 12px; padding-right: 12px; }
  .brand { font-size: 15px; gap: 8px; margin-left: 0; margin-right: 0; }
  .brand-symbol { width: 30px; height: 32px; }
  .workspace-bar { padding: 0 20px; }
}
@media (max-width: 760px) {
  .studio-shell { display: block; height: 100dvh; }
  .studio-main { height: 100%; }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: 240px; z-index: 40; transform: translateX(-100%); visibility: hidden; transition: transform .18s; }
  .sidebar.open { transform: translateX(0); visibility: visible; }
  .nav-backdrop { display: block; position: fixed; inset: 0; z-index: 39; background: #20223750; }
  .mobile-menu { display: inline-flex; }
  .workspace-bar { min-height: 56px; padding: 0 12px; gap: 9px; }
  .breadcrumbs { gap: 8px; flex: 1; }
  .breadcrumbs > span, .breadcrumbs > svg { display: none; }
  .save-state { display: none; }
  .bar-actions { gap: 0; }
  .notice { padding: 9px 14px; font-size: 11px; }
}

/* 目录和编辑器共享结构，业务页面只定义各自内容。 */
.split-workspace { display: grid; grid-template-columns: 260px minmax(0,1fr); flex: 1; min-height: 0; min-width: 0; }
.directory-pane { display: flex; flex-direction: column; padding: 18px 12px 0; border-right: 1px solid var(--line); background: #fcfcfd; min-width: 0; min-height: 0; }
.directory-heading { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 17px; gap: 8px; }
.directory-heading h2 { font-size: 13px; letter-spacing: 0; display: flex; align-items: center; gap: 9px; }
.directory-pane > .search-box { margin: 0 4px 6px; }
.directory-caption { color: #a0a4b1; font-size: 11px; padding: 20px 9px 10px; }
.directory-scroll { flex: 1; overflow: auto; min-height: 0; padding-bottom: 16px; }
.directory-footer { display: flex; align-items: center; gap: 7px; border-top: 1px solid var(--line); color: #979dad; font-size: 11px; padding: 17px 5px; margin-top: auto; }
.tree-row { display: flex; align-items: center; min-height: 39px; border-radius: 6px; margin: 3px 0; padding-right: 6px; }
.tree-row.selected { background: var(--accent-soft); color: var(--accent-text); }
.tree-row:hover:not(.selected) { background: var(--surface); }
.tree-toggle, .tree-spacer { flex-shrink: 0; width: 18px; height: 30px; padding: 0; color: #a6a6b8; }
.tree-select { min-width: 0; flex: 1; display: flex; align-items: center; gap: 9px; text-align: left; height: 39px; padding: 0; font-size: 12px; }
.tree-select > span { flex: 1; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
.tree-select svg { color: #a6a4b7; }
.tree-row.selected .tree-select svg { color: var(--accent); }
.tree-select small { color: #a1a0b2; font-size: 11px; }
.list-item { display: flex; width: 100%; align-items: center; gap: 11px; border-radius: 6px; text-align: left; padding: 13px 11px; margin-bottom: 3px; min-width: 0; }
.list-item:hover { background: #f4f4f8; }
.list-item.selected { background: var(--accent-soft); }
.list-item.selected .item-copy b { color: var(--accent-text); }
.list-item > svg:last-child { color: #c1bbd7; }
.item-copy { flex: 1; min-width: 0; }
.item-copy b { display: block; font-size: 12px; font-weight: 500; line-height: 1.6; }
.item-copy small { display: block; color: #9196a4; font-size: 11px; margin-top: 3px; line-height: 1.6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.editor-pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.editor-heading { display: flex; align-items: center; gap: 18px; padding: 30px 36px 26px; min-width: 0; }
.heading-copy { flex: 1; min-width: 0; }
.heading-copy h2 { margin: 5px 0 8px; overflow-wrap: anywhere; font-size: 22px; }
.heading-copy p { color: #979baa; font-size: 11px; }
.heading-copy p > span { padding: 0 9px; color: #c7cad4; }
.editor-scroll { overflow-y: auto; min-height: 0; flex: 1; }
.editor-status { display: flex; gap: 7px; align-items: center; border-top: 1px solid var(--line); color: #a1a5b0; font-size: 11px; padding: 13px 36px; }
.editor-status .status-dot { width: 4px; height: 4px; }
.number-action { display: flex; align-items: flex-end; gap: 12px; }
.number-action .field { max-width: 180px; margin: 0; }
.relation-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
.relation-row { display: flex; align-items: center; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 7px; cursor: pointer; }
.relation-row.selected { border-color: #cfc7ed; background: #fcfbff; }
.strategy-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 25px; }
.strategy-option { display: flex; gap: 11px; padding: 14px; border: 1px solid var(--line); border-radius: 7px; cursor: pointer; }
.strategy-option.selected { border-color: #bfb4e7; background: #faf8ff; }
.strategy-option b { font-size: 12px; font-weight: 500; }
.strategy-option small { display: block; margin-top: 5px; color: var(--muted); }
.prompt-editor { background: #fafbfc; min-height: 205px; }
.input-meta { display: flex; justify-content: space-between; font-size: 11px; color: #a0a4b2; margin-top: -11px; }
.capability-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.capability-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
.capability-row { display: flex; align-items: center; gap: 9px; border: 1px solid var(--line); border-radius: 6px; padding: 13px 10px; font-size: 11px; overflow-wrap: anywhere; cursor: pointer; }
.capability-row svg { color: #9d99af; }
.capability-row.selected { background: #faf8ff; border-color: #d5cdec; }
.data-list { border-top: 1px solid var(--line); margin: 18px 0 26px; }
.data-row { display: flex; width: 100%; align-items: center; gap: 14px; border-bottom: 1px solid var(--line); padding: 18px 5px; text-align: left; }
button.data-row:hover { background: var(--surface); }
.data-row > svg:last-child { color: #b9bdc9; }
.row-provider { max-width: 150px; font-size: 11px; text-align: right; }
/* 任务正文占主画布，输入框固定在底部，执行参数收纳到右侧。 */
.task-layout { display: grid; grid-template-columns: minmax(0,1fr) 272px; flex: 1; min-height: 0; }
.task-layout.roster-hidden { grid-template-columns: minmax(0,1fr); }
.conversation-pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #fff; }
.conversation-toolbar { padding: 18px 26px; display: flex; justify-content: space-between; align-items: center; }
.conversation-toolbar.execution-panel-toolbar { justify-content: flex-end; }
.conversation-toolbar > span { display: flex; align-items: center; gap: 7px; color: #9b9eab; font-size: 11px; }
.conversation-scroll { flex: 1; min-height: 0; overflow: auto; display: flex; }
.task-welcome { width: 100%; max-width: 720px; padding: 48px 38px; margin: auto; }
.welcome-mark { display: inline-flex; align-items: center; justify-content: center; width: 62px; height: 62px; border: 1px solid #e6e0f7; border-radius: 19px; background: linear-gradient(140deg,#fbfaff,#ede9fb); color: #9380d4; box-shadow: 0 9px 20px #8974c808; margin-bottom: 28px; transform: rotate(-4deg); }
.welcome-mark svg { transform: rotate(4deg); }

/* 办公室：图形采用硬边与有限色板，操作与文字保持可读。 */
.office-workspace { --pixel-ink: #5b526d; --pixel-paper: #fcf8f0; display: flex; flex-direction: column; min-height: 0; flex: 1; background: #f8f7fb; }
.office-overview { display: flex; justify-content: space-between; gap: 24px; align-items: center; padding: 27px 30px 22px; }
.office-overview .eyebrow { font-size: 10px; letter-spacing: 1.8px; color: #9690a5; }
.office-overview h2 { font-size: 26px; color: #43394f; margin: 6px 0 8px; letter-spacing: 1px; }
.office-overview p { font-size: 12px; color: #8e8497; }
.office-live-dot { display: inline-block; width: 7px; height: 7px; background: #6ea68b; margin: 0 0 4px 13px; box-shadow: 3px 3px 0 #dceade; }
.office-stats { display: flex; gap: 28px; padding-right: 5px; }
.office-stats > span { font-size: 11px; color: #918799; }
.office-stats b { display: block; font: 25px/1.5 Consolas, monospace; color: #615575; }
.office-stats > span:last-child b { color: #b78a4c; }
.office-toolbar { display: flex; align-items: center; gap: 10px; margin: 0 30px; padding: 12px 0; border-top: 1px solid #e5e0ec; border-bottom: 1px solid #e5e0ec; }
.office-toolbar > select { font-size: 11px; width: 210px; background: #fff; }
.office-toolbar > select:nth-of-type(2) { width: 135px; }
.office-toolbar .search-box { flex: 1; min-width: 120px; max-width: 330px; }
.office-animation-toggle { flex-shrink: 0; white-space: nowrap; }
.office-toolbar > .icon-button { margin-left: auto; }
.office-sync { display: flex; align-items: center; gap: 8px; padding: 12px 30px; font-size: 10px; color: #92889d; }
.office-restored-link { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 20px; font-size: 11px; color: #786787; background: #f0ecf7; }
.office-legend { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 10px; color: #8b7d95; }
.office-legend i { height: 6px; width: 6px; background: #9476c2; margin-left: 7px; }
.office-legend .attention { background: #cf9c40; } .office-legend .done { background: #54a083; } .office-legend .failed { background: #cb657d; }
.office-content { display: grid; grid-template-columns: minmax(0,1fr) 290px; flex: 1; min-height: 0; }
.office-rooms { padding: 5px 24px 32px 30px; overflow-y: auto; min-width: 0; }
.office-room { margin-bottom: 24px; border: 2px solid #7a6b83; box-shadow: 4px 4px 0 #ded7e5; background: var(--pixel-paper); }
.office-room-title { background: #f7f0e7; padding: 11px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 2px solid #7a6b83; }
.office-room-title > div { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.office-room-title h3 { color: #61546b; font-size: 12px; }
.office-room-title span, .office-room-title small { font-size: 10px; color: #a08887; }
.pixel-room-marker { width: 7px; height: 7px; background: #a087ba; box-shadow: 2px 2px 0 #d6c5df; }
.office-wall { display: flex; justify-content: space-around; gap: 24px; align-items: center; padding: 20px 24px 15px; background: repeating-linear-gradient(90deg, #f0e6dc 0px, #f0e6dc 31px, #e8dbd3 32px, #e8dbd3 33px); border-bottom: 7px solid #a18b8f; box-shadow: inset 0 -3px #c7b1ab; }
.pixel-window { width: 142px; max-width: 35%; height: auto; image-rendering: pixelated; }
.pixel-whiteboard { padding: 10px 15px; background: #fffaf0; border: 3px solid #ad9291; box-shadow: 3px 3px #d2c0b7; color: #857689; min-width: 125px; max-width: 45%; }
.pixel-whiteboard > span { font: 8px/1.5 Consolas, monospace; display: block; letter-spacing: 1px; color: #b1a2a7; }
.pixel-whiteboard > b { font-size: 12px; display: block; margin: 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pixel-whiteboard > small { font-size: 9px; }
.pixel-clock { width: 32px; height: 32px; border: 4px solid #a6929f; background: #fff9e8; position: relative; box-shadow: 2px 2px #d3c2c3; flex: 0 0 auto; }
.pixel-clock i { position: absolute; height: 9px; width: 3px; background: #8c778c; top: 4px; left: 11px; }
.pixel-clock i:after { content: ''; position: absolute; width: 7px; height: 3px; top: 7px; left: 0; background: #8c778c; }
.pixel-plant { width: 34px; height: 53px; flex-shrink: 0; image-rendering: pixelated; }
.office-floor { padding: 18px 20px 0; background-color: #efe2ce; background-image: repeating-linear-gradient(0deg, transparent 0, transparent 39px, #d7c8b780 39px, #d7c8b780 40px), repeating-linear-gradient(90deg, transparent 0, transparent 79px, #dcccbc80 79px, #dcccbc80 80px); }
.office-desks { display: grid; grid-template-columns: repeat(auto-fit,minmax(145px,1fr)); gap: 18px 12px; }
.office-seat { position: relative; display: flex; align-items: center; flex-direction: column; padding: 10px 7px 8px; border: 2px solid transparent; min-width: 0; border-radius: 0; transition: background .15s; }
.office-seat:hover { background: #fff9ee60; border-color: #b7a0b660; }
.office-seat.selected { background: #fff9ee8c; border-color: #a185b5; box-shadow: 3px 3px 0 #b6a1b145; }
.office-seat:focus-visible { outline: 3px solid #7c65a4; outline-offset: 2px; }
.seat-status { font-size: 11px; display: flex; align-items: center; gap: 5px; background: #fff9efdb; border: 1px solid #c8bdb380; padding: 3px 7px; color: #736778; min-height: 25px; }
.seat-status i { width: 5px; height: 5px; background: #aea3aa; }
.seat-status.running i, .seat-status.starting i { background: #8874b4; }
.seat-status.waiting i, .seat-status.retrying i, .seat-status.reconnecting i { background: #d5a553; }
.seat-status.done i { background: #679f89; }
.seat-status.failed i { background: #ce727b; }
.pixel-desk { width: 152px; max-width: 100%; height: 140px; margin-top: 4px; image-rendering: pixelated; }
.office-seat > b { font-size: 13px; font-weight: 600; margin: 3px 0; color: #625162; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat-scene-label { font-size: 11px; color: #806395; margin: 3px 0 7px; }
.office-seat.mood-approval, .office-seat.mood-repair { background: #fff0c591; box-shadow: inset 0 3px #d9aa55; }
.office-seat.mood-failed { background: #f8dce68c; box-shadow: inset 0 3px #cc7c91; }
.office-seat.mood-celebrate { background: #dbecd77a; box-shadow: inset 0 3px #82b09b; }
.office-seat.mood-thinking, .office-seat.mood-tool { background: #ede1f577; }
.office-seat.mood-approval .seat-scene-label { color: #9d6d1d; font-weight: 600; }
.office-seat.mood-failed .seat-scene-label { color: #ae536b; }
.office-seat.mood-celebrate .seat-scene-label { color: #467b64; }
.office-seat > small { font-size: 9px; color: #9d8380; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat-time { font: 9px/1.7 Consolas, monospace; color: #a39390; margin-top: 3px; }
.seat-quiet { font-size: 10px; color: #896829; background: #fff5d9; margin-top: 5px; padding: 2px 5px; }
.office-inactivity { font-size: 11px; line-height: 1.8; color: #896829; background: #fff5d9; padding: 10px; margin-bottom: 12px; }
.office-last-event { font-size: 10px; color: #8e7d9b; margin-bottom: 20px; }
.pixel-employee-position.at-desk { transform: translate(13px, 10px); }
.pixel-employee-position.off-desk { transform: translate(-18px, 9px); }
.scene-coding .pixel-arms, .scene-building .pixel-arms { animation: pixel-typing .35s steps(2, end) infinite; }
.scene-coding .pixel-screen-lines, .scene-tool .pixel-screen-lines { animation: pixel-screen .9s steps(2, end) infinite; }
.scene-thinking .pixel-head { animation: pixel-think 2s steps(2, end) infinite; transform-origin: 65px 65px; }
.pixel-thought { animation: pixel-bob 2.4s steps(3, end) infinite; }
.pixel-sign { animation: pixel-bob .9s steps(2, end) infinite; }
.scene-celebrate .pixel-person { animation: pixel-jump 1s steps(3, end) infinite; }
.pixel-confetti { animation: pixel-confetti 1.8s steps(4, end) infinite; }
.scene-arriving .pixel-person { animation: pixel-arrive 2s steps(4, end) infinite; }
.scene-repair .pixel-arms { animation: pixel-typing .8s steps(2, end) infinite; }
.scene-writing .pixel-arms { animation: pixel-typing 1.1s steps(2, end) infinite; }
.scene-failed .pixel-person { transform: rotate(8deg); transform-origin: 65px 100px; }
.pixel-distress, .pixel-signal { animation: pixel-screen 2s steps(2, end) infinite; }
.pixel-steam { animation: pixel-steam 2.5s steps(4, end) infinite; }
.pixel-tool-orbit { animation: pixel-gear 5s steps(8, end) infinite; transform-origin: 28px 23px; }
.pixel-blocks { animation: pixel-bob 1.3s steps(3, end) infinite; }
.pixel-cat { width: 46px; height: 32px; flex-shrink: 0; }
.pixel-cat-breath { animation: pixel-screen 3s steps(2, end) infinite; }
.office-workspace.animations-paused svg *, .office-workspace.connection-stale svg * { animation: none !important; }
.office-lounge { display: flex; align-items: flex-end; padding: 26px 4px 16px; gap: 22px; }
.pixel-sofa { display: flex; height: 34px; width: 87px; padding: 5px; background: #9aa59b; border: 4px solid #80918a; border-bottom: 7px solid #6d807b; box-shadow: 2px 4px #ab9b8b; }
.pixel-sofa i { flex: 1; background: #b3b9a2; border-right: 2px solid #94a394; }
.lounge-table { width: 38px; height: 25px; background: #d2b198; border: 3px solid #b3907e; border-bottom: 6px solid #9e7b70; box-shadow: 2px 3px #c4b299; }
.floor-label { margin-left: auto; font-size: 9px; letter-spacing: 1px; color: #b3a08f; padding-bottom: 5px; }
.office-pagination { padding: 12px 16px; display: flex; justify-content: center; gap: 20px; align-items: center; font-size: 10px; color: #8e8098; background: #faf5ee; }
.office-detail { border-left: 1px solid #e7e0eb; background: #fcfbfe; overflow: auto; min-width: 0; }
.office-detail-heading { padding: 22px 23px 0; }
.office-detail-heading h2 { margin: 7px 0; font-size: 20px; color: #4f425e; }
.office-detail-heading p { font-size: 10px; color: #9a8da5; }
.office-detail-portrait { margin: 16px 23px; background: #f0e9f5; border: 1px solid #dfd3e9; display: flex; align-items: center; justify-content: center; gap: 16px; }
.office-detail-portrait .pixel-desk { width: 115px; height: 115px; flex-shrink: 0; }
.office-detail-portrait .badge { font-size: 10px; white-space: normal; }
.office-detail-body { padding: 4px 23px 26px; }
.office-detail-body h3 { font-size: 11px; color: #8e7d9b; margin-bottom: 8px; }
.office-activity { font-size: 12px; color: #695677; margin-bottom: 21px; overflow-wrap: anywhere; }
.office-task-goal { font-size: 12px; color: #54495f; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 150px; overflow: auto; margin-bottom: 22px; }
.office-detail-body dl { display: grid; grid-template-columns: 66px minmax(0,1fr); gap: 11px 12px; font-size: 10px; line-height: 1.7; margin: 0 0 24px; }
.office-detail-body dt { color: #9e91a6; }
.office-detail-body dd { color: #6d617a; margin: 0; overflow-wrap: anywhere; }
.office-detail-body details { font-size: 11px; color: #8a7897; margin: 15px 0; }
.office-detail-body pre { margin-top: 10px; font-size: 10px; max-height: 180px; overflow: auto; }
.office-detail-body > .btn { width: 100%; }
@keyframes pixel-typing { to { transform: translateY(-2px); } }
@keyframes pixel-screen { to { opacity: .45; } }
@keyframes pixel-bob { 50% { transform: translateY(-4px); } }
@keyframes pixel-think { 50% { transform: rotate(-7deg); } }
@keyframes pixel-jump { 50% { transform: translateY(-9px); } }
@keyframes pixel-confetti { from { transform: translateY(-5px); opacity: .8; } to { transform: translateY(12px); opacity: .1; } }
@keyframes pixel-arrive { 50% { transform: translateX(16px) translateY(-2px); } }
@keyframes pixel-steam { to { transform: translateY(-8px); opacity: 0; } }
@keyframes pixel-gear { to { transform: rotate(360deg); } }
@media (max-width: 1200px) { .office-content { grid-template-columns: minmax(0,1fr) 255px; } .office-rooms { padding-left: 20px; padding-right: 18px; } .office-floor { padding: 14px 12px 0; } .office-wall { gap: 14px; padding: 15px 12px; } .pixel-clock { display: none; } .office-desks { grid-template-columns: repeat(auto-fit,minmax(117px,1fr)); gap: 12px 8px; } .office-legend { display: none; } }
@media (max-width: 960px) { .office-content { grid-template-columns: minmax(0,1fr); overflow-y: auto; } .office-rooms, .office-detail { overflow: visible; } .office-detail { border-top: 1px solid #e7e0eb; border-left: 0; } .office-detail-portrait { float: right; width: 200px; margin: 0 24px 15px; } .office-detail-body { max-width: 550px; } }
@media (max-width: 760px) { .office-overview { padding: 20px 16px 15px; gap: 12px; } .office-overview h2 { font-size: 21px; } .office-overview p { font-size: 10px; } .office-overview .eyebrow { font-size: 8px; letter-spacing: 1px; } .office-stats { gap: 13px; padding: 0; } .office-stats b { font-size: 20px; } .office-stats > span { font-size: 9px; } .office-toolbar { margin: 0 16px; flex-wrap: wrap; gap: 8px; } .office-toolbar > select:first-child { width: calc(100% - 42px); } .office-toolbar .search-box { order: 2; max-width: none; flex: 1; min-width: 140px; } .office-toolbar > select:nth-of-type(2) { order: 3; width: 110px; } .office-sync { padding: 10px 16px; } .office-rooms { padding: 3px 16px 20px; } .office-room-title { padding: 10px; } .office-room-title > small { display: none; } .office-room-title h3 { font-size: 11px; } .office-floor { padding: 14px 10px 0; } .office-desks { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px 8px; } .office-wall { gap: 14px; padding: 13px 10px; } .office-wall > .pixel-plant { display: none; } .pixel-window { width: 110px; max-width: 40%; } .pixel-whiteboard { padding: 8px; max-width: 55%; min-width: 100px; } .pixel-whiteboard b { font-size: 10px; } .pixel-whiteboard small { font-size: 8px; } .floor-label { display: none; } .office-lounge { justify-content: space-around; } .office-detail-portrait { float: none; width: auto; margin: 16px 23px; } }
/* 窄屏将筛选和动画控件固定为两行，避免新增开关挤乱原工具栏。 */
@media (max-width: 760px) {
  .office-toolbar { display: grid; grid-template-columns: minmax(0,1fr) 90px 66px 32px; }
  .office-toolbar > select:first-child { grid-column: 1 / 3; grid-row: 1; width: 100%; }
  .office-toolbar .office-animation-toggle { grid-column: 3; grid-row: 1; padding: 6px; }
  .office-toolbar > .icon-button { grid-column: 4; grid-row: 1; margin: 0; }
  .office-toolbar .search-box { grid-column: 1 / 3; grid-row: 2; min-width: 0; }
  .office-toolbar > select:nth-of-type(2) { grid-column: 3 / 5; grid-row: 2; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .office-workspace svg * { animation: none !important; } }

/* 对话按用户轮次组织，执行细节按成员展开。 */
.conversation-heading .badge { white-space: nowrap; }
.task-round { margin: 12px 0 30px; }
.task-round-heading { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.task-round-heading > b { font-size: 13px; }
.task-round-heading time { color: var(--muted); font-size: 11px; flex: 1; }
.round-request { padding: 18px 0; }
.round-request > span { font-size: 11px; color: var(--accent-text); font-weight: 600; }
.round-request p { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.8; }
.round-member-status { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px; margin: 0 0 12px; }
.round-member-status button { display: flex; align-items: center; gap: 7px; min-width: 0; padding: 9px 10px; background: #f8f8fb; border-radius: 6px; text-align: left; font-size: 11px; }
.round-member-status b { flex-shrink: 0; }
.round-member-status button > span:last-child { color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 10px; }
.round-executions > summary { display: flex; align-items: center; gap: 9px; padding: 13px 14px; border: 1px solid var(--line); background: #f7f8fa; border-radius: 8px; cursor: pointer; font-size: 12px; }
.round-executions > summary > span { flex: 1; font-size: 11px; color: var(--muted); }
.round-executions[open] > summary > svg:last-child { transform: rotate(180deg); }
.execution-card { padding: 16px; margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; min-width: 0; }
.execution-card.is-active { border-color: #cec5e9; box-shadow: inset 3px 0 0 var(--accent-text); }
.execution-heading { display: flex; gap: 10px; align-items: center; }
.execution-heading > div { flex: 1; min-width: 0; }
.execution-heading b { font-size: 13px; }
.execution-heading small { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; }
.execution-heading > .badge { flex-shrink: 0; }
.execution-times { display: flex; flex-wrap: wrap; gap: 5px 18px; color: var(--muted); font-size: 10px; margin: 12px 0; }
.execution-assignment { border-radius: 6px; background: #f7f7fb; padding: 10px 12px; font-size: 12px; overflow-wrap: anywhere; }
.execution-assignment summary { cursor: pointer; line-height: 1.7; }
.execution-assignment p { white-space: pre-wrap; line-height: 1.8; }
.execution-attempt-note { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 12px 0; color: var(--muted); font-size: 11px; line-height: 1.8; }
.execution-attempt-note .text-button { font-size: inherit; }
.execution-feedback { margin: 12px 0 0; border: 1px solid #e3d9ed; border-radius: 7px; background: #fbf9fd; overflow: hidden; }
.execution-feedback > summary { display:flex; align-items:center; flex-wrap:wrap; gap:7px; padding:9px 11px; color:var(--accent-text); font-size:11px; cursor:pointer; }
.execution-feedback > summary span { margin-left:auto; color:var(--muted); font-size:10px; }
.execution-feedback[open] > summary { border-bottom:1px solid #e9e1f0; }
.feedback-item { padding:10px 11px; border-bottom:1px solid #eee9f3; font-size:11px; }
.feedback-item:last-child { border-bottom:0; }
.feedback-item > header { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.feedback-item time { display:block; margin-top:6px; color:var(--muted); font-size:10px; }
.feedback-item { overflow-wrap:anywhere; }
.feedback-item summary { cursor:pointer; color:var(--muted); margin-top:8px; }
.feedback-item p { white-space:pre-wrap; line-height:1.7; margin:7px 0 0; }
.feedback-item small { display:block; color:var(--muted); white-space:pre-wrap; line-height:1.6; margin-top:5px; }
.feedback-item blockquote { margin:8px 0 0; padding:7px 9px; border-left:2px solid #9e8dc9; background:#f3eff9; white-space:pre-wrap; line-height:1.7; }
.feedback-pending { box-shadow: inset 3px 0 0 #d28a4b; }
.execution-tabs { border-top: 1px solid var(--line); margin-top: 14px; }
.execution-tabs .tabs { gap: 15px; }
.execution-tabs .tabs button { font-size: 11px; padding: 10px 0; }
.execution-message { padding: 12px 0; }
.execution-message > div { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; font-size: 10px; color: var(--muted); }
.execution-message pre { font: inherit; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.85; margin: 10px 0 0; max-height: 360px; overflow: auto; }
.execution-activity { margin-top: 18px; }
/* 标题作为父级区域，展开后的正文由内缩与边线明确归属。 */
.execution-activity > summary { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); cursor: pointer; font-size: 12px; list-style: none; }
.execution-activity > summary > span { flex: 1; color: var(--muted); font-size: 11px; }
.execution-activity > summary > svg { flex-shrink: 0; color: var(--accent-text); }
.execution-activity[open] > summary { background: var(--accent-soft); border-color: #e0daf5; color: var(--accent-text); }
.execution-activity > .muted { margin: 12px 0 4px 32px; }
.execution-activity[open] > summary > svg:last-child { transform: rotate(180deg); }
.execution-activity > summary::-webkit-details-marker { display: none; }
.execution-activity > summary:hover { color: var(--accent-text); }
.execution-activity > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.execution-updates > details > summary, .execution-updates details summary { cursor: pointer; font-size: 11px; color: var(--muted); padding-top: 10px; }
.execution-steps .run-step > summary { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; cursor: pointer; font-size: 11px; }
.execution-steps .run-step time { color: var(--muted); margin-left: auto; font-size: 10px; }
.execution-steps pre { overflow-wrap: anywhere; white-space: pre-wrap; }
.delivery-result { margin-top: 14px; padding: 16px 18px; border: 1px solid #cce3d9; border-radius: 8px; background: #f4faf7; font-size: 12px; overflow-wrap: anywhere; }
.delivery-result > b { color: #237654; }
.delivery-result p, .delivery-result li { white-space: pre-wrap; line-height: 1.8; }
.delivery-result h5 { margin: 16px 0 6px; font-size: 11px; }
.delivery-result ul { padding-left: 18px; margin: 8px 0; }
.delivery-result details summary { cursor: pointer; }
.round-outcome, .older-executions { color: var(--muted); font-size: 11px; line-height: 1.8; }
.older-executions button { margin-left: 10px; }
.composer-permissions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 8px; }
.composer-setting { display: inline-flex; align-items: center; gap: 7px; }
.composer-permissions select { width: auto; font-size: 11px; padding: 5px 22px 5px 8px; min-height: 28px; border: 0; background: #f6f5fa; }
.composer-permissions small { margin-left: auto; font-size: 10px; }
.sidebar-recents { margin-top: 16px; }
.sidebar-recents-heading { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 11px; }
.sidebar-recents-toggle { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: 1; min-width: 0; min-height: 30px; padding: 5px 8px; border-radius: 5px; text-align: left; color: inherit; }

.recent-task b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; font-weight: 500; }

@media (max-width: 1200px) { .task-project-selector { padding-left: 28px; padding-right: 28px; } }
@media (max-width: 760px) {
  .conversation-heading { gap: 8px; flex-wrap: wrap; }

  .execution-heading { flex-wrap: wrap; }
  .execution-heading > div { min-width: 120px; }
  .round-executions > summary { flex-wrap: wrap; gap: 6px; }
  .execution-tabs .tabs { gap: 10px; }

}

/* 正文穿插紧凑操作行；沿用工作台配色，终端详情独立滚动。 */
.execution-transcript { width: calc(100% - 14px); max-width: 960px; min-width: 0; margin: 14px 0 0 14px; padding: 2px 0 6px 18px; border-left: 2px solid #e7e1f3; }
.transcript-message { margin: 10px 0 16px; }
.transcript-message:first-child { margin-top: 0; }
.transcript-message-text { font-size: 13px; line-height: 1.85; white-space: pre-wrap; overflow-wrap: anywhere; }
.transcript-message > footer { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 6px; font-size: 10px; color: var(--muted); }
.transcript-operation, .transcript-command-group { min-width: 0; margin: 3px 0; }
.transcript-operation > summary, .transcript-command-group > summary { display: flex; align-items: center; gap: 7px; width: fit-content; max-width: 100%; min-height: 30px; padding: 4px 2px; color: var(--muted); cursor: pointer; font-size: 12px; line-height: 1.6; list-style: none; }
.transcript-operation > summary::-webkit-details-marker, .transcript-command-group > summary::-webkit-details-marker { display: none; }
.transcript-operation > summary:hover, .transcript-command-group > summary:hover { color: var(--accent-text); }
.transcript-operation > summary:focus-visible, .transcript-command-group > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.transcript-operation-label { flex-shrink: 0; }
.transcript-operation-preview { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.transcript-operation[open] > summary > svg:last-child, .transcript-command-group[open] > summary > svg:last-child { transform: rotate(180deg); }
.transcript-operation-state { flex-shrink: 0; font-size: 10px; }
.transcript-operation-state.running { color: var(--accent-text); }
.transcript-operation-state.failed, .transcript-operation-label.failed, .transcript-exit.failed { color: var(--red); }
.transcript-operation-state.cancelled { color: var(--muted); }
/* 命令组、组内命令和输出面板各自缩进一级，避免所有记录贴在同一条左边线上。 */
.transcript-command-list { min-width: 0; margin: 4px 0 8px 7px; padding-left: 16px; border-left: 1px solid var(--line); }
.transcript-operation-panel { margin: 6px 0 12px 21px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
.transcript-operation-panel > header { padding: 9px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 500; }
.transcript-operation-output { max-height: 320px; overflow: auto; padding: 10px 12px 12px; background: var(--bg); scrollbar-gutter: stable; }
.transcript-operation-output pre { margin: 0; font-family: "Cascadia Code", Consolas, "Microsoft YaHei", monospace; font-size: 12px; line-height: 1.75; white-space: pre; overflow-wrap: normal; }
.transcript-operation-output code { font: inherit; }
.transcript-operation-output .transcript-command { margin-bottom: 12px; }
.transcript-operation-panel > footer { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; padding: 8px 12px; color: var(--muted); font-size: 10px; }
.transcript-operation-times { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.transcript-exit { margin-left: auto; flex-shrink: 0; font-size: 11px; }
@media (max-width: 760px) {
  .execution-transcript { width: calc(100% - 8px); margin-left: 8px; padding-left: 12px; }
  .transcript-command-list { margin-left: 5px; padding-left: 10px; }
  .transcript-operation-panel { margin-left: 14px; }
  .transcript-operation > summary, .transcript-command-group > summary { min-height: 36px; }
  .transcript-operation-output { max-height: 260px; }
}

/* 复用工作台浅紫色强调，以标题、分析阶段和正文区分层级。 */
.execution-reasoning { min-width: 0; margin-top: 12px; border: 1px solid #e4dff2; border-radius: 8px; background: #fbfaff; overflow: hidden; }
.reasoning-toggle { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 12px; color: var(--accent-text); text-align: left; font-size: 12px; }
.reasoning-toggle:hover { background: var(--accent-soft); }
.reasoning-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.reasoning-toggle small { margin-left: auto; color: var(--muted); font-size: 10px; }
.reasoning-toggle > svg { flex-shrink: 0; }
.reasoning-toggle[aria-expanded="true"] > svg { transform: rotate(180deg); }
.reasoning-state { color: var(--muted); font-size: 11px; }
.reasoning-indicator { width: 7px; height: 7px; flex-shrink: 0; border-radius: 50%; background: #b5accd; }
.is-streaming .reasoning-indicator { background: var(--accent); animation: reasoning-pulse 1.5s ease-in-out infinite; }
.reasoning-body { max-height: 320px; overflow: auto; padding: 0 14px 8px; border-top: 1px solid #e9e3f5; scrollbar-gutter: stable; }
.reasoning-body[hidden] { display: none; }
.reasoning-note, .reasoning-empty { font-size: 11px; color: var(--muted); line-height: 1.7; }
.reasoning-segment { margin: 14px 0 8px 3px; padding-left: 12px; border-left: 2px solid #e4dcf4; }
.reasoning-segment > header { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; color: var(--muted); font-size: 10px; }
.reasoning-segment > header b { color: var(--accent-text); }
.reasoning-segment > header time { margin-left: auto; }
.reasoning-segment > p { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; line-height: 1.8; margin: 8px 0; }
.reasoning-segment > footer, .reasoning-last-update { color: var(--muted); font-size: 10px; line-height: 1.7; }
.reasoning-last-update { padding: 0 12px 8px; }
@keyframes reasoning-pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .is-streaming .reasoning-indicator { animation: none; } }
@media (max-width: 760px) { .reasoning-toggle { flex-wrap: wrap; gap: 6px; } .reasoning-body { max-height: 260px; padding-left: 10px; padding-right: 10px; } }

.notification-anchor { position: relative; }
.notification-trigger { position: relative; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 7px; color: var(--muted); }
.notification-trigger:hover, .notification-trigger.has-notices { background: var(--accent-soft); color: var(--accent-text); }
.notification-trigger > span { position: absolute; top: -3px; right: -6px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 10px; background: #ba5b46; color: white; font-size: 9px; line-height: 15px; }
.notification-center { position: fixed; top: 56px; right: 24px; width: min(470px, calc(100vw - 24px)); max-height: calc(100dvh - 76px); z-index: 55; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 50px #25213626; }

.notification-clear-feedback .text-button { padding: 0; font-size: 11px; }
.notification-clear-hint { margin-top: 14px; color: var(--muted); font-size: 10px; line-height: 1.7; }
.notification-preview { position: fixed; top: 66px; right: 24px; z-index: 54; width: min(360px, calc(100vw - 24px)); display: flex; align-items: flex-start; padding: 12px; background: #fff; border: 1px solid #d8d0ec; border-radius: 10px; box-shadow: 0 5px 20px #27203b15; }

.notification-preview b { font-size: 12px; margin-bottom: 7px; color: var(--accent-text); }

.delivery-notice { padding: 14px; border: 1px solid var(--line); border-left: 3px solid #59a887; border-radius: 8px; margin-bottom: 10px; overflow-wrap: anywhere; }

.delivery-notice > div { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; }
.delivery-notice > div > span { font-size: 10px; color: var(--muted); }
.delivery-notice-heading { align-items: center; }
.delivery-notice-heading > b { flex: 1; min-width: 0; }
.delivery-notice-heading > span { white-space: nowrap; }
.delivery-notice-heading > .icon-button { width: 24px; height: 24px; margin: -4px -4px -4px 0; flex-shrink: 0; }
.delivery-notice p { font-size: 12px; line-height: 1.7; margin: 8px 0; }
.delivery-notice-summary { color: var(--muted); max-height: 80px; overflow: auto; }
.delivery-notice > button { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; margin-top: 10px; }
.approval-card { border: 1px solid #e6d9b9; border-radius: 8px; padding: 13px; margin: 12px 0; background: #fffdf7; overflow-wrap: anywhere; }
.approval-card header { display: flex; gap: 8px; font-size: 12px; align-items: flex-start; color: #866429; margin-bottom: 8px; }
.approval-card header svg { flex-shrink: 0; }

.approval-fields { margin: 12px 0; }
.approval-fields dt { margin-top: 10px; font-size: 10px; color: #8b795c; }
.approval-fields dd { margin: 4px 0 0; }
.approval-fields pre { font-size: 11px; line-height: 1.65; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 180px; overflow: auto; }
.approval-card footer { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

@media (max-width: 760px) { .notification-center, .notification-preview { right: 12px; } .bar-actions { gap: 10px; } }

/* 审批操作范围优先显示；差异默认折叠，长路径与窄屏不会撑开面板。 */
.approval-file-change { border-top: 1px solid var(--line); padding: 10px 0; min-width: 0; overflow-wrap: anywhere; }

.provider-diagnostics .diagnostic-directory { display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin:8px 0; }
.diagnostic-directory span { color:var(--muted);flex-shrink:0; }
.diagnostic-directory code { overflow-wrap:anywhere;min-width:0;font-size:12px; }

/* 参考图只用于输入区排版，色板、圆角与基础控件沿用 Team Studio。 */
.task-composer-area { flex-shrink: 0; padding-top: 12px; }
.task-composer-context { display: flex; align-items: center; gap: 12px; min-height: 38px; padding: 5px 10px 7px; margin: 0 10px -1px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px 10px 0 0; }
.task-directory-trigger { display: inline-flex; align-items: center; gap: 7px; min-width: 0; max-width: 65%; padding: 5px 8px; border-radius: 6px; color: var(--muted); font-size: 11px; }
.task-directory-trigger > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-directory-trigger:hover:not(:disabled), .task-directory-trigger[aria-expanded=true] { color: var(--accent-text); background: var(--accent-soft); }
.task-composer-team { display: flex; align-items: center; gap: 6px; margin-left: auto; min-width: 0; color: var(--muted); font-size: 10px; }
.task-composer-team > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-compose-form { position: relative; }
.task-compose-form textarea { display: block; }
.task-compose-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; margin-top: 8px; }
.task-compose-permissions { display: flex; flex-wrap: wrap; gap: 6px 12px; min-width: 0; }

.task-directory-menu { position: fixed; z-index: 35; display: flex; flex-direction: column; padding: 8px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--text); box-shadow: 0 8px 30px #302b4b14; overflow: auto; }
.task-directory-search { display: flex; flex-shrink: 0; align-items: center; gap: 7px; padding: 2px 6px 8px; color: var(--muted); }
.task-directory-search input { font-size: 12px; padding: 7px 8px; }
.task-directory-options { min-height: 0; overflow: auto; }

@media (max-width: 760px) {

}

/* 图形、筛选与详情独立滚动；参与者固定在图上方，宽团队可横向浏览。 */
.sequence-dialog { width: min(1500px, calc(100vw - 40px)); max-width: none; height: min(920px, calc(100dvh - 40px)); max-height: none; padding: 0; }
.sequence-dialog[open] { display: flex; flex-direction: column; }
.sequence-dialog .dialog-top { padding: 18px 24px; flex: 0 0 auto; }
.sequence-dialog .dialog-top > div { min-width: 0; }
.sequence-dialog .dialog-top h3 { margin-top: 4px; }
.sequence-dialog .dialog-top p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 75vw; margin: 7px 0 0; color: var(--muted); font-size: 11px; }
.sequence-controls { padding: 12px 24px; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.sequence-controls label { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; }

.sequence-controls .sequence-detail-toggle { cursor: pointer; color: var(--text); }

.sequence-controls > button { margin-left: auto; }
.sequence-legend { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; padding: 10px 24px; color: var(--muted); font-size: 10px; flex-shrink: 0; }
.sequence-legend > span { display: flex; align-items: center; gap: 5px; }
.sequence-legend i { width: 15px; height: 3px; background: var(--sequence-color); }
.sequence-legend small { margin-left: auto; font-size: 10px; }
.sequence-request, .sequence-dispatch { --sequence-color: #7961c7; }
.sequence-result, .sequence-delivery { --sequence-color: #31846a; }
.sequence-message { --sequence-color: #467bad; }
.sequence-operation { --sequence-color: #a66c27; }
.sequence-progress { --sequence-color: #777488; }
.sequence-failure { --sequence-color: #c44753; }
.sequence-error { margin: 0 24px 8px; }
.sequence-coverage { margin: 0 24px 10px; color: var(--muted); font-size: 10px; flex-shrink: 0; }
.sequence-coverage summary { cursor: pointer; }
.sequence-coverage p { margin: 5px 0; }
.sequence-body { display: flex; flex: 1; min-height: 0; border-top: 1px solid var(--line); }
.sequence-scroll { flex: 1; min-width: 0; overflow: auto; overscroll-behavior: contain; background: #fdfdff; }
.sequence-canvas { min-height: 100%; }
.sequence-actor-header { position: sticky; top: 0; z-index: 1; background: #fdfdff; border-bottom: 1px solid var(--line); }
.sequence-actor-header rect { fill: #f5f3fc; stroke: #e2dcef; }
.sequence-actor-name { fill: var(--text); font-size: 12px; font-weight: 600; }
.sequence-actor-role, .sequence-axis-label { fill: var(--muted); font-size: 10px; }
.sequence-chart { display: block; }
.sequence-lifeline { stroke: #d9d4e4; stroke-width: 1; stroke-dasharray: 4 5; }

.sequence-event-hit { fill: transparent; stroke: transparent; }

.sequence-event.selected .sequence-event-hit { fill: #eeebfaad; stroke: #d3c9ed; }
.sequence-event:focus-visible .sequence-event-hit { stroke: var(--accent); stroke-width: 2; }
.sequence-arrow, .sequence-arrow-head { fill: none; stroke: var(--sequence-color); stroke-width: 1.7; }
.sequence-arrow.is-response { stroke-dasharray: 5 4; }
.sequence-arrow-head { stroke-linejoin: round; }
.sequence-event-title { fill: var(--sequence-color); font-size: 11px; font-weight: 600; }
.sequence-event-preview { fill: var(--muted); font-size: 10px; }
.sequence-event-round, .sequence-event-time { fill: var(--muted); font-size: 10px; }
.sequence-details { flex: 0 0 304px; width: 304px; min-width: 0; overflow: auto; padding: 20px; border-left: 1px solid var(--line); background: #fff; overscroll-behavior: contain; }
.sequence-details .empty-state { padding: 50px 0; }
.sequence-detail-heading h4 { font-size: 15px; margin: 14px 0 7px; }
.sequence-detail-heading > .badge { float: right; font-size: 10px; }
.sequence-kind { color: var(--sequence-color); font-size: 11px; }
.sequence-detail-heading p { font-size: 11px; overflow-wrap: anywhere; line-height: 1.8; }
.sequence-detail-heading p > span { color: var(--muted); padding: 0 4px; }
.sequence-details dl { padding: 14px 0; border-block: 1px solid var(--line); margin: 16px 0; font-size: 11px; }
.sequence-details dt { color: var(--muted); margin-bottom: 5px; }
.sequence-details dd { margin: 0 0 12px; overflow-wrap: anywhere; }
.sequence-details dd:last-child { margin-bottom: 0; }
.sequence-details h5 { margin: 18px 0 8px; font-size: 11px; }

function collectAgentsInTree(teams, rootId) {
  const entries = new Map(teams.map(entry => [entry.id, entry]));

  const visit = id => {
    if (visited.has(id)) return;
    visited.add(id);
    const entry = entries.get(id);
    if (!entry) return;
    entry.agents.forEach(agent => agents.set(agent.id, agent));
    (entry.team.children || []).forEach(visit);
  };
  visit(rootId);
  return [...agents.values()];
}

    try {

          method: 'POST',
          headers: {
            'content-type': 'application/json'
          },
          body: JSON.stringify(body),
          signal: AbortSignal.timeout(30000)
        });

      setCatalogError(error.message);

      setCatalogLoading(false);

  };

    return {
      ids: [],
